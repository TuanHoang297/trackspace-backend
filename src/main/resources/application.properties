# ============================================
# TrackSpace Backend Configuration
# ============================================

# Server Configuration
server.port=8080
spring.application.name=trackspace

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/trackspace?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT Configuration
jwt.secret=trackspace-super-secret-key-for-hs512-algorithm-please-change-in-production-2026
jwt.expiration=86400000

# Google OAuth2 Configuration
# Get client-id and client-secret at: https://console.cloud.google.com/
# Set real values in application-local.properties (gitignored, never commit it)
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile

# GitHub OAuth2 Configuration
# Create an OAuth App at: https://github.com/settings/developers
# Set real values in application-local.properties (gitignored, never commit it)
spring.security.oauth2.client.registration.github.client-id=YOUR_GITHUB_CLIENT_ID
spring.security.oauth2.client.registration.github.client-secret=YOUR_GITHUB_CLIENT_SECRET
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# Load local secrets if the file exists (gitignored)
spring.config.import=optional:classpath:application-local.properties

# OAuth2 redirect URI after successful login (frontend URL)
# Local: http://localhost:5173 or :3000  |  Production: set via env var or application-prod.properties
app.oauth2.redirect-uri=http://localhost:3000/oauth2/callback
app.oauth2.authorized-redirect-uris=${OAUTH2_AUTHORIZED_REDIRECT_URIS:http://localhost:5173/oauth2/redirect,http://localhost:3000/oauth2/redirect,http://localhost:5173/oauth2/callback,http://localhost:3000/oauth2/callback}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email Configuration (for notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Jira API Configuration
jira.api.base-url=https://api.atlassian.com
jira.api.timeout=30000

# GitHub API Configuration
github.api.base-url=https://api.github.com
github.api.timeout=30000
# GitHub Webhook secret — must match the "Secret" field when registering the webhook in GitHub repo settings
# Leave empty to skip signature verification (NOT recommended for production)
github.webhook.secret=${GITHUB_WEBHOOK_SECRET:trackspace-webhook-secret-2026}

# GEMINI API Configuration (for SRS Generation)
ai.gemini.api-key=${GEMINI_KEY:YOUR_GEMINI_KEY_HERE}
ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
ai.gemini.model=gemini-2.5-flash

# Logging Configuration
logging.level.root=INFO
logging.level.com.trackspace=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Actuator Configuration (Health Check)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
