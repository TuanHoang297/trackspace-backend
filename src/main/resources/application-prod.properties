# ============================================
# Production Environment Configuration
# ============================================

# Server port - Elastic Beanstalk uses 5000 by default for Java
server.port=${SERVER_PORT:5000}

# Database Configuration (Production - AWS RDS MySQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA Configuration (Production)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (Production - Use Environment Variables)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Email Configuration (Production)
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}

# OpenAI Configuration (Production)
openai.api.key=${OPENAI_API_KEY}

# Logging Configuration (Production)
logging.level.root=WARN
logging.level.com.trackspace=INFO
logging.level.org.springframework.web=WARN

# CORS (Production - Specific allowed origins)
cors.allowed-origins=${ALLOWED_ORIGINS:https://trackspace-vn.vercel.app}

# Swagger/OpenAPI (enabled for testing)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Security
server.ssl.enabled=false
