# ============================================
# Production Environment Configuration
# ============================================

# Server port - Elastic Beanstalk uses 5000 by default for Java
server.port=${SERVER_PORT:5000}

# Database Configuration (Production - AWS RDS MySQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA Configuration (Production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (Production - Use Environment Variables)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Email Configuration (Production)
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}

# Gemini API Configuration (Production - for SRS Generation)
ai.gemini.api-key=${GEMINI_KEY}
ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
ai.gemini.model=gemini-3.1-flash-lite-preview
#better but slower
#ai.gemini.model=gemini-3-flash-preview
# more model here: https://ai.google.dev/gemini-api/docs/models

# Logging Configuration (Production)
logging.level.root=WARN
logging.level.com.trackspace=INFO
logging.level.org.springframework.web=WARN

# CORS (Production - Specific allowed origins)
cors.allowed-origins=${ALLOWED_ORIGINS:https://trackspace-vn.vercel.app}

# OAuth2 authorized redirect URIs (Production frontend + local for dev convenience)
app.oauth2.authorized-redirect-uris=${OAUTH2_AUTHORIZED_REDIRECT_URIS:https://trackspace-vn.vercel.app/oauth2/redirect,http://localhost:5173/oauth2/redirect,http://localhost:3000/oauth2/redirect}

# Google OAuth2 credentials (must be set as env vars on AWS EB)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# Fix redirect_uri_mismatch: explicitly set the callback URL sent to Google
# Must exactly match what is registered in Google Cloud Console Authorized redirect URIs
spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_BASE_URL:https://d2mqs9rbz0vv4c.cloudfront.net}/login/oauth2/code/google

# GitHub OAuth2 credentials (must be set as env vars on AWS EB)
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri=${BACKEND_BASE_URL:https://d2mqs9rbz0vv4c.cloudfront.net}/login/oauth2/code/github

# Fix Spring behind AWS ELB: trust X-Forwarded headers so base URL is detected as https://
server.forward-headers-strategy=native

# Swagger/OpenAPI (enabled for testing)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Security
server.ssl.enabled=false
